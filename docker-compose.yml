services:
  mfa-recovery:
    build:
      context: .
      target: app
    image: mfa-recovery:latest
    container_name: mfa-recovery
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MFA_API_HOST: 0.0.0.0
      MFA_API_PORT: 3198
      AWS_CLI_PATH: /usr/local/bin/aws
    expose:
      - "3000"
      - "3198"
    networks:
      - caddy-net

networks:
  caddy-net:
    external: true
